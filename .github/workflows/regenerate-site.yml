name: Regenerate Site Pages

on:
  workflow_dispatch:  # Manual trigger only - use when site needs regenerating without new episode

jobs:
  regenerate:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Required to push changes back to repo
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Regenerate all outputs from episode metadata
        env:
          VIBECAST_AUTHOR: ${{ secrets.VIBECAST_AUTHOR }}
          VIBECAST_SITE_URL: ${{ secrets.VIBECAST_SITE_URL }}
          VIBECAST_FEED_URL: ${{ secrets.VIBECAST_FEED_URL }}
          VIBECAST_OWNER_EMAIL: ${{ secrets.VIBECAST_OWNER_EMAIL }}
          VIBECAST_ARTWORK_URL: ${{ secrets.VIBECAST_ARTWORK_URL }}
          VIBECAST_AUTHOR_URL: ${{ secrets.VIBECAST_AUTHOR_URL }}
          VIBECAST_R2_PUBLIC_URL: ${{ secrets.VIBECAST_R2_PUBLIC_URL }}
          VIBECAST_LOCATION_NAME: ${{ secrets.VIBECAST_LOCATION_NAME }}
          VIBECAST_LOCATION_LAT: ${{ secrets.VIBECAST_LOCATION_LAT }}
          VIBECAST_LOCATION_LON: ${{ secrets.VIBECAST_LOCATION_LON }}
          VIBECAST_TIMEZONE: ${{ secrets.VIBECAST_TIMEZONE }}
        run: |
          python scripts/regenerate_all.py
      
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml docs/*.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🔄 Regenerate RSS feed and site [skip ci]"
            git push
          fi
