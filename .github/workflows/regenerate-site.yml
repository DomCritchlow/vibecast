name: Regenerate Site Pages

on:
  workflow_dispatch:  # Manual trigger only - use when site needs regenerating without new episode

jobs:
  regenerate:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Required to push changes back to repo
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Regenerate all outputs from episode metadata
        run: |
          uv run python scripts/regenerate_all.py
      
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml docs/*.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🔄 Regenerate RSS feed and site [skip ci]"
            git push
          fi
