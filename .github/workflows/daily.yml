name: Daily Podcast

on:
  schedule:
    # Run at 09:00 UTC daily = 05:00 EDT (summer) / 04:00 EST (winter) in New York
    # GitHub Actions uses UTC, so adjust for your timezone
    - cron: "0 9 * * *"
  
  # Allow manual triggering from Actions tab
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no API calls)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  generate:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Required to push feed.xml and state.json updates
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      # apt instead of setup-ffmpeg: the action's johnvansickle.com release
      # lookup is flaky and silently killed the 2026-06-28 and 2026-07-02 runs
      - name: Setup FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python dependencies
        run: uv sync --no-dev

      - name: Run daily podcast pipeline
        env:
          # Required API keys
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          # Cloudflare R2 storage
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # Personal settings live directly in podcast/config.yaml now;
          # VIBECAST_* env vars remain supported as optional overrides.
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            uv run python -m podcast.run_daily --dry-run -v
          else
            uv run python -m podcast.run_daily -v
          fi
      
      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add the updated files
          # - Episode JSON (single source of truth)
          # - Generated feed.xml and HTML
          # - State tracking
          git add podcast/episodes/*.json docs/feed.xml docs/*.html podcast/state.json || true
          # - Sound library: effects generated on special days, reused later
          git add podcast/assets/sfx || true
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            # Get today's date for commit message
            DATE=$(date +%Y-%m-%d)
            git commit -m "🎙️ Daily episode: ${DATE} [skip ci]"
            git push
          fi
      
      - name: Summary
        run: |
          echo "## 🎙️ Vibecast Daily Run Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Date:** $(date +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "- **Mode:** ${{ github.event.inputs.dry_run == 'true' && 'Dry Run' || 'Production' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the [Actions logs](https://github.com/${{ github.repository }}/actions) for details." >> $GITHUB_STEP_SUMMARY

