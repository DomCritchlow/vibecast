name: Regenerate Brand Artwork

# Manual trigger only — regenerates the static brand images (show cover,
# default episode art, host portrait) with the current image model and
# commits them. Episode art is generated per-episode by the daily run.
on:
  workflow_dispatch:
    inputs:
      asset:
        description: 'Which asset to regenerate'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'cover'
          - 'default'
          - 'host'
      upload_fallback:
        description: 'Upload default episode art to R2 (used when AI art fails)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  regenerate:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Push regenerated images back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Generate brand artwork
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.upload_fallback }}" = "true" ] && \
             { [ "${{ github.event.inputs.asset }}" = "all" ] || [ "${{ github.event.inputs.asset }}" = "default" ]; }; then
            EXTRA="--upload-fallback"
          fi
          uv run python scripts/generate_brand_art.py --asset "${{ github.event.inputs.asset }}" $EXTRA

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/artwork.png docs/default-episode-art.png docs/assets/images || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🎨 Regenerate brand artwork (${{ github.event.inputs.asset }}) [skip ci]"
            git push
          fi
