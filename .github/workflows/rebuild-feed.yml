name: Rebuild RSS Feed

on:
  workflow_dispatch:  # Manual trigger only - use when feed needs rebuilding without new episode

jobs:
  rebuild:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Generate RSS feed from episode metadata
        run: |
          uv run python scripts/generate_feed.py
      
      - name: Commit and push updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml
          if git diff --staged --quiet; then
            echo "No changes to feed"
          else
            git commit -m "📡 Regenerate RSS feed from metadata [skip ci]"
            git push
          fi
