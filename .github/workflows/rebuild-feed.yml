name: Rebuild RSS Feed

on:
  push:
    branches:
      - main
    paths:
      - 'podcast/rss_feed.py'
      - 'scripts/rebuild_feed_from_r2.py'
  workflow_dispatch:  # Manual trigger also available

jobs:
  rebuild:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Rebuild RSS feed from R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          VIBECAST_AUTHOR: ${{ secrets.VIBECAST_AUTHOR }}
          VIBECAST_SITE_URL: ${{ secrets.VIBECAST_SITE_URL }}
          VIBECAST_FEED_URL: ${{ secrets.VIBECAST_FEED_URL }}
          VIBECAST_OWNER_EMAIL: ${{ secrets.VIBECAST_OWNER_EMAIL }}
          VIBECAST_ARTWORK_URL: ${{ secrets.VIBECAST_ARTWORK_URL }}
          VIBECAST_AUTHOR_URL: ${{ secrets.VIBECAST_AUTHOR_URL }}
          VIBECAST_R2_PUBLIC_URL: ${{ secrets.VIBECAST_R2_PUBLIC_URL }}
          VIBECAST_TIMEZONE: ${{ secrets.VIBECAST_TIMEZONE }}
        run: |
          python scripts/rebuild_feed_from_r2.py
      
      - name: Commit and push updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml
          if git diff --staged --quiet; then
            echo "No changes to feed"
          else
            git commit -m "📡 Rebuild RSS feed from R2 [skip ci]"
            git push
          fi
