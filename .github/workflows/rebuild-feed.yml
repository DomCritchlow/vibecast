name: Rebuild RSS Feed

on:
  workflow_dispatch:  # Manual trigger only - use when feed needs rebuilding without new episode

jobs:
  rebuild:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Generate RSS feed from episode metadata
        env:
          VIBECAST_AUTHOR: ${{ secrets.VIBECAST_AUTHOR }}
          VIBECAST_SITE_URL: ${{ secrets.VIBECAST_SITE_URL }}
          VIBECAST_FEED_URL: ${{ secrets.VIBECAST_FEED_URL }}
          VIBECAST_OWNER_EMAIL: ${{ secrets.VIBECAST_OWNER_EMAIL }}
          VIBECAST_ARTWORK_URL: ${{ secrets.VIBECAST_ARTWORK_URL }}
          VIBECAST_AUTHOR_URL: ${{ secrets.VIBECAST_AUTHOR_URL }}
          VIBECAST_R2_PUBLIC_URL: ${{ secrets.VIBECAST_R2_PUBLIC_URL }}
        run: |
          python scripts/generate_feed.py
      
      - name: Commit and push updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml
          if git diff --staged --quiet; then
            echo "No changes to feed"
          else
            git commit -m "📡 Regenerate RSS feed from metadata [skip ci]"
            git push
          fi
