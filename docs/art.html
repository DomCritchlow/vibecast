    <!-- Transcript/Show Notes Modal -->
    <div class="modal-overlay" id="transcript-modal">
        <div class="modal">

    <script>
        // Navigation toggle for mobile
        function toggleNav() {
            document.getElementById('nav-links').classList.toggle('open');
        }
        
        // Modal functions
        function openModal(title, content) {
            const modal = document.getElementById('transcript-modal');
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-content').innerHTML = content;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        
        function closeModal() {
            document.getElementById('transcript-modal').classList.remove('active');
            document.body.style.overflow = '';
        }
        
        // Close modal on overlay click or Escape key
        document.getElementById('transcript-modal').addEventListener('click', (e) => {
            if (e.target.classList.contains('modal-overlay')) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
        
        // Utility: escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Utility: convert URLs to links
        function linkify(text) {
            return text.split(' ').map(word => {
                if (word.startsWith('http://') || word.startsWith('https://')) {
                    return `<a href="${word}" target="_blank" rel="noopener">${word}</a>`;
                }
                return word;
            }).join(' ');
        }
        
        // Format text for display
        function formatTextForDisplay(text) {
            const escaped = escapeHtml(text);
            const linked = linkify(escaped);
            return linked.split('\n').join('<br>');
        }
        
        // Copy to clipboard
        function copyToClipboard(el) {
            navigator.clipboard.writeText(el.textContent);
            const original = el.textContent;
            el.textContent = 'Copied!';
            setTimeout(() => el.textContent = original, 1500);
        }
    </script>
    
    
  <script>
    const START_DATE = '2026-01-20';
    const BASE_URL = 'https://pub-180e0ac8417f4800855805b0185bd45d.r2.dev/episodes';

    function generateDates(startStr) {
      const dates = [];
      const start = new Date(startStr + 'T12:00:00');
      const today = new Date();
      today.setHours(12, 0, 0, 0);
      for (let d = new Date(today); d >= start; d.setDate(d.getDate() - 1)) {
        dates.push(d.toISOString().split('T')[0]);
      }
      return dates;
    }

    const grid = document.getElementById('art-grid');

    generateDates(START_DATE).forEach((dateStr, i) => {
      const episode = document.createElement('div');
      episode.className = 'art-episode';

      const img = document.createElement('img');
      img.alt = `Episode ${dateStr}`;
      img.loading = i < 12 ? 'eager' : 'lazy';
      img.decoding = 'async';

      img.onerror = () => episode.remove();
      img.src = `${BASE_URL}/${dateStr}/episode-art.png`;

      episode.appendChild(img);
      grid.appendChild(episode);
    });
  </script>
