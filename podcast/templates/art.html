{% extends "base.html" %}

{% block title %}Art — {{ short_title }}{% endblock %}

{% block head %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    .art-header {
      padding: 20px 48px;
    }

    .art-header h1 {
      font-size: clamp(1.6rem, 3vw, 2.6rem);
      font-weight: 300;
      letter-spacing: 0.04em;
      color: #c0b8a8;
      line-height: 1.1;
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    .art-header h1 em {
      font-style: italic;
      color: #5a5550;
    }

    .art-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2px;
    }

    @media (max-width: 1100px) {
      .art-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 680px) {
      .art-grid { grid-template-columns: repeat(2, 1fr); }
      .art-header { padding: 48px 24px 40px; }
    }

    .art-episode {
      aspect-ratio: 1;
      position: relative;
      overflow: hidden;
      background: #141210;
    }

    .art-episode img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
{% endblock %}

{% block scripts %}
  <script>
    const START_DATE = '2026-01-20';
    const BASE_URL = '{{ r2_public_url }}/episodes';

    function generateDates(startStr) {
      const dates = [];
      const start = new Date(startStr + 'T12:00:00');
      const today = new Date();
      today.setHours(12, 0, 0, 0);
      for (let d = new Date(today); d >= start; d.setDate(d.getDate() - 1)) {
        dates.push(d.toISOString().split('T')[0]);
      }
      return dates;
    }

    const grid = document.getElementById('art-grid');

    generateDates(START_DATE).forEach((dateStr, i) => {
      const episode = document.createElement('div');
      episode.className = 'art-episode';

      const img = document.createElement('img');
      img.alt = `Episode ${dateStr}`;
      img.loading = i < 12 ? 'eager' : 'lazy';
      img.decoding = 'async';

      img.onerror = () => episode.remove();
      img.src = `${BASE_URL}/${dateStr}/episode-art.png`;

      episode.appendChild(img);
      grid.appendChild(episode);
    });
  </script>
{% endblock %}
