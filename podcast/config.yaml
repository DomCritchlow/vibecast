# =============================================================================
# AI-GENERATED EPISODE ARTWORK
# =============================================================================
# Generates unique cover art for each episode in an editorial risograph style
# using OpenAI's GPT-Image image generation API.
artwork:
  enabled: true
  provider: "openai"           # Image generation provider
  openai:
    model: "gpt-image-2"       # gpt-image-2 (April 2026): better prompt following + text rendering

  # Image settings
  size: 1024                   # Square image size (1024x1024)
  format: "png"                # Output format
  quality: "medium"            # low, medium, or high
  
  # R2 Storage
  upload_to_r2: true
  r2_prefix: "episodes"        # Base prefix for episode assets
  r2_fallback_key: "static/default-episode-art.png"
  
  # Color palette for accent colors
  accent_palette:
    - "burnt orange"
    - "deep teal"
    - "electric purple"
    - "muted tan"
    - "sage green"
    - "dusty rose"
    - "cobalt blue"
    - "golden yellow"
    - "terracotta red"
    - "midnight navy"
    - "moss green"
    - "warm coral"
  
  # Determinism settings
  accent_strategy: "rotate"    # rotate | random | fixed
  fixed_accent: "burnt orange" # Used when accent_strategy is "fixed"

  # Style settings
  style: "vibecast_riso_v1"    # Style template version
  secondary_detail_max: 1      # Max secondary details in scene
  prompt_version: "v1"         # Prompt template version
  
  # Metadata
  save_prompt_metadata: true   # Save prompts and briefs to R2 for debugging
  
  # Reliability
  retries: 1                   # Retry attempts on failure
  timeout_seconds: 120         # API timeout (gpt-image-2 reasons before generating)

# =============================================================================
# CONTENT FILTERING
# =============================================================================
filters:
  global_max_items: 7
  max_per_source: 2

  # Guarantee personal-interest stories a presence: reserve N of the
  # global_max_items slots for sources tagged with one of these tags
  # (when they have fresh items). Without this, variety feeds rarely hit
  # boost keywords and would lose to AI/science sources every day.
  variety:
    slots: 1
    tags: ["variety"]

  # How long a used URL blocks re-use (state.json is pruned past this window)
  url_retention_days: 90

  block_keywords:
    - "shooting"
    - "killed"
    - "dead"
    - "crash"
    - "terror"
    - "war"
    - "flood"
    - "earthquake"
    - "outbreak"
    - "scandal"
  
  boost_keywords:
    - "research"
    - "discovered"
    - "developed"
    - "published"
    - "demonstrated"
    - "launched"
    - "analysis"
    - "breakthrough"
    - "system"
    - "method"
    - "capability"

# =============================================================================
# SCRIPT WRITER (LLM for script, title, and art-brief generation)
# =============================================================================
# The writer is the voice of the show. Claude Opus 4.8 is the default —
# noticeably better prose than the mini-tier models for ~$0.04/episode.
# Requires ANTHROPIC_API_KEY; without it the pipeline automatically falls
# back to the OpenAI model below so the nightly run never breaks.
writer:
  provider: "anthropic"        # anthropic (Claude, recommended) or openai

  anthropic:
    model: "claude-opus-4-8"   # Claude Opus 4.8 — adaptive thinking, strongest writing

  openai:
    model: "gpt-5.4-mini"      # Fallback: best price/performance OpenAI mini model

  # Craft hints injected into the system prompt (WRITE FOR THE EAR section)
  script_hints:
    - "Specific beats general: one real number or detail is worth a paragraph of adjectives"
    - "Explain like a smart friend who's excited, not a presenter reading a rundown"
    - "No hyperbole — if a fact is interesting, saying it plainly is the flex"
    - "No filler, no throat-clearing — every sentence earns its place"
    - "Curiosity is the engine: ask the question the listener would ask, then answer it"

# =============================================================================
# TEXT-TO-SPEECH CONFIGURATION
# =============================================================================
# Extensible provider system - easily swap between TTS services
#
# Available providers:
#   - openai: OpenAI TTS (default) - gpt-4o-mini-tts, ~$0.03-0.10/episode
#   - elevenlabs: ElevenLabs eleven_v3 - the quality/expressiveness upgrade,
#     ~$0.50/episode (requires ELEVENLABS_API_KEY). Flip provider to try it.
#
# To add new providers: create a class in podcast/tts/ that extends TTSProvider
# =============================================================================
tts:
  provider: "openai"          # Options: openai, elevenlabs
  
  # --- OpenAI TTS Settings (active) ---
  openai:
    # Model selection
    # tts-1: Fast, cheaper ($15/1M chars) - supports 9 voices
    # tts-1-hd: Better quality ($30/1M chars) - supports 9 voices  
    # gpt-4o-mini-tts: Latest model with all 13 voices + instructions support
    model: "gpt-4o-mini-tts"  
    
    # Voice selection - ALL 13 voices available with gpt-4o-mini-tts
    # RECOMMENDED FOR BEST QUALITY: marin, cedar
    # alloy - neutral, balanced
    # ash - NEW voice
    # ballad - NEW voice (gpt-4o-mini-tts only)
    # cedar - BEST QUALITY (gpt-4o-mini-tts only)
    # coral - NEW voice
    # echo - male, warm, conversational
    # fable - British accent, expressive storytelling ⭐ YOUR CHOICE
    # marin - BEST QUALITY (gpt-4o-mini-tts only)
    # nova - friendly, warm, energetic
    # onyx - deep male, authoritative
    # sage - NEW voice
    # shimmer - soft, gentle, calming
    # verse - NEW voice (gpt-4o-mini-tts only)
    voice: "fable"            # British, expressive storyteller - great for engaging narratives
    
    # Speech speed: 0.25 (very slow) to 4.0 (very fast)
    speed: 0.95               # Slightly faster for energizing morning vibe
    
    # Output format (for TTS generation)
    # MP3 works great with gpt-4o-mini-tts - clean output with minimal processing needed
    format: "mp3"             # Options: mp3, opus, aac, flac, wav, pcm
    
    # Instructions (optional) - Only works with gpt-4o-mini-tts
    # Removed: per-chunk instructions caused voice tone inconsistency / male-female drift
  
  # --- ElevenLabs TTS Settings (disabled) ---
  # To enable: set provider to "elevenlabs" and configure below
  # Requires ELEVENLABS_API_KEY env var
  elevenlabs:
    # Voice ID or preset name (e.g., "rachel", "adam", "josh")
    # Full list: https://elevenlabs.io/voice-library
    voice_id: "rachel"

    # Model options:
    #   eleven_v3 - Most expressive, supports inline audio tags (recommended)
    #   eleven_multilingual_v2 - High quality, very stable
    #   eleven_flash_v2_5 - Lowest latency/cost
    model_id: "eleven_v3"
    
    # Voice control (0.0 to 1.0)
    stability: 0.5            # Higher = more consistent, lower = more expressive
    similarity_boost: 0.75    # Higher = closer to original voice
    
    # Output format
    format: "mp3_44100_128"   # Options: mp3_44100_128, mp3_44100_192, pcm_*

  # --- Audio Post-Processing ---
  # Ultra-light processing optimized for gpt-4o-mini-tts + fable voice
  # Removes low-end rumble and applies minimal polish (output: MP3 @ 192k)
  #
  # Presets:
  #   none         - No processing (pure TTS output)
  #   fable_light  - Ultra-minimal: removes rumble, gentle polish (RECOMMENDED) ⭐
  #   clarity      - Remove tin-can sound (for older tts-1 model)
  #   podcast      - Full professional podcast processing chain
  audio_processing:
    enabled: false             # Enable/disable post-processing
    preset: "none" #"fable_light"     # Ultra-light processing optimized for fable

# =============================================================================
# STORAGE - Cloudflare R2
# =============================================================================
storage:
  provider: "r2"
  
  r2:
    bucket: "vibecast"
    key_prefix: "episodes/"
    public_base_url: "https://pub-180e0ac8417f4800855805b0185bd45d.r2.dev"
    # 1 day: long enough for CDN efficiency, short enough that a re-uploaded
    # (corrected) episode propagates. Don't use "immutable" on date-keyed files.
    cache_control: "public, max-age=86400"

# =============================================================================
# RSS FEED
# =============================================================================
feed:
  max_episodes: 30
  episode_title_format: "{podcast_title} — {date}"

# =============================================================================
# SCHEDULE (reference only - actual cron is in GitHub Actions)
# =============================================================================
schedule:
  timezone: "America/New_York"           # Override: VIBECAST_TIMEZONE
  target_hour: 5                         # 05:00 local time (Eastern)

