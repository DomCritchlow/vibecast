# =============================================================================
# VIBECAST CONFIGURATION
# =============================================================================
# This file defines everything about your podcast's personality.
# Change the vibe, change the show.
#
# ⚠️  IF YOU FORKED/CLONED THIS REPO: Update these before deploying!
#     - podcast.* (author, email, site/feed/artwork URLs)
#     - location.name, lat, lon
#     - storage.r2.public_base_url
#
# Personal settings live directly in this file. If you prefer to keep them
# out of the repo, every value below marked "Override:" can instead be set
# via a VIBECAST_* environment variable (see .env.example).
# =============================================================================

# =============================================================================
# THE VIBE - Core personality of your podcast
# =============================================================================
vibe:
  name: "Morning Thread"
  
  mood:
    primary: "curious"
    secondary: "informed"
    energy: "engaged-but-chill"
  
  voice_persona:
    name: "Bento"
    personality:
      - "genuinely curious about how things work"
      - "explains why things matter, not just what happened"
      - "conversational but doesn't waste your time"
      - "finds signal in the noise"
      - "makes you smarter without trying too hard"
    # NOTE: greetings/closings are no longer injected into the script prompt —
    # episodes now open cold inside the best story and land their own endings.
    # Kept only as reference for Bento's register.
    greetings:
      - "Hey, it's Bento. Here's what caught my attention today."
      - "Morning. Bento here with some things you might actually care about."
      - "Good morning, it's Bento. Let's talk about what's interesting today."
      - "Good morning. Bento here — let's get into it."
      - "Hey, Bento here. Got some good ones for you today."
      - "Morning. Here's what I've been reading — it's Bento."
      - "It's Bento. Let's talk about what's worth knowing today."
    closings:
      - "That's the thread for today. Bento out. Go make something happen."
      - "Alright, that's what I'm following. Bento signing off. See you tomorrow."
      - "That's it for today. This is Bento. Catch you next time."
      - "That's your morning thread. Go be curious out there."
      - "Alright, that's a wrap. Bento out — make it a good one."
      - "And that's the thread. See you tomorrow with more worth knowing."
      - "That's what caught my eye today. Bento signing off — catch you tomorrow."
  
  avoid:
    emotions: ["fear", "outrage", "panic", "doom"]
    language: ["shocking", "you won't believe", "slams", "destroys", "crisis"]
    topics: ["violence", "disaster", "political attacks", "celebrity drama"]
  
  embrace:
    emotions: ["curiosity", "insight", "discovery", "understanding", "progress"]
    language: ["developed", "discovered", "published", "analyzed", "demonstrated", "achieved"]
    topics: ["research", "innovation", "science", "technology", "breakthroughs", "systems", "infrastructure", "exploration"]

# =============================================================================
# PODCAST IDENTITY
# =============================================================================
podcast:
  title: "Vibecast: Morning Thread"
  tagline: "Tech, science, and what's actually interesting"
  description: "A short daily podcast following the most interesting threads in AI, space, and technology. No hype, just what matters."
  author: "Dominic"
  owner_email: "critchlowd49@gmail.com"
  language: "en-us"
  category: "News"
  subcategory: "Daily News"
  explicit: "no"
  # critchlow.us became the canonical Pages domain on 2026-07-03 (custom
  # domain on the user site; project pages inherit it). The old
  # domcritchlow.github.io URLs now 301 here — but to http://, so podcast
  # apps must subscribe to these https URLs directly.
  artwork_url: "https://critchlow.us/vibecast/artwork.png"
  site_url: "https://critchlow.us/vibecast/"
  feed_url: "https://critchlow.us/vibecast/feed.xml"
  github_url: "https://github.com/domcritchlow/vibecast"  # Link shown in footer

# =============================================================================
# EPISODE STRUCTURE
# =============================================================================
episode:
  target_minutes: 5
  
  structure:
    - segment: "greeting"
      duration: "~15 seconds"
    - segment: "weather"
      duration: "~30 seconds"
    - segment: "stories"
      duration: "~3 minutes"
      count: "5-7"
    - segment: "closing"
      duration: "~30 seconds"
  
  pacing:
    include_pauses: true
    pause_between_stories: "0.6s"
    pause_after_greeting: "0.5s"
    overall_tempo: "upbeat"

# =============================================================================
# LOCATION (for weather)
# =============================================================================
# VIBECAST_LOCATION_* env vars still override these if you ever need to.
location:
  name: "New York, NY"
  lat: 40.7128
  lon: -74.0060
  units: "fahrenheit"                    # Options: celsius, fahrenheit

