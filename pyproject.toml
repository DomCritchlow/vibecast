[project]
name = "vibecast"
version = "2.0.0"
description = "Your personalized AI podcast, generated daily and tailored to your vibe."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.92.0",
    "boto3>=1.35.0",
    "elevenlabs>=2.27.0",
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "openai>=2.14.0",
    "pydantic>=2.9.0",
    "python-dateutil>=2.9.0",
    "pyyaml>=6.0.2",
    "weasyprint>=62.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # long lines in prompts/templates are fine
]

[tool.ruff.lint.per-file-ignores]
# Legacy one-off maintenance scripts: sys.path bootstrap forces late imports
"scripts/*" = ["E402", "E722", "B007", "SIM102"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.uv]
# This repo is an application, not an installable library
package = false
